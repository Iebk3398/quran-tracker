name: Deploy

on:
  push:
    branches: [main]

# Railway et Vercel se déploient automatiquement via leur intégration GitHub native.
# Les migrations tournent au démarrage du serveur Railway (railway.json startCommand).
# Ce workflow est conservé pour déclencher des déploiements manuels si besoin.

jobs:
  # Placeholder — les déploiements sont gérés par Railway et Vercel directement
  notify:
    name: Deployments triggered
    runs-on: ubuntu-latest
    steps:
      - run: echo "Railway and Vercel deploy automatically on push to main"
